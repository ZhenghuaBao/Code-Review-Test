# E2E test workflow — uses the published action at @v1 (public on Marketplace),
# matching the shipped example. The action checks out the PR head internally,
# so no local `actions/checkout` step is needed.

name: Orca-Code-Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/orca-code-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@feat/wallclock-timeout  # TEMP: testing wall-clock timeout; revert to @v1 after
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          timeout-minutes: "0.5"  # 30 seconds — force timeout for verification
